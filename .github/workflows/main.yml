name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Magic Build Script
        run: |
          LOG="$GITHUB_WORKSPACE/error_log.txt"
          echo "==== APK BUILD LOG ====" > $LOG
          echo "Zip file open kar rahe hain..." >> $LOG
          unzip *.zip -d my_app >> $LOG 2>&1 || echo "Zip open fail ho gaya!" >> $LOG
          
          DIR=$(find . -name "gradlew" -printf "%h\n" | head -n 1)
          if [ -z "$DIR" ]; then
            echo "❌ ERROR: Aapki zip file mein 'gradlew' file nahi mili! App ka code incomplete hai." >> $LOG
            exit 1
          fi
          
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug >> $LOG 2>&1
          
      - name: Result Download Karein
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Download-Me
          path: |
            **/*.apk
            error_log.txt
